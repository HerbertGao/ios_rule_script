name: Sync release/herbertgao onto upstream

# Rebase our single custom commit (rule/Surge/0.Common.AI/0.Common.AI.list)
# onto the latest blackmatrix7/ios_rule_script master. Conflict-free because the
# AI list is a file upstream never touches. Never merge upstream in — always rebase.

on:
  schedule:
    - cron: '43 5 * * *'   # daily ~05:43 UTC (avoid top-of-hour congestion)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/herbertgao
          fetch-depth: 0
      - name: Rebase onto upstream and force-push
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/blackmatrix7/ios_rule_script.git
          git fetch --no-tags upstream master
          git rebase upstream/master || {
            git rebase --abort 2>/dev/null || true
            echo "::error::rebase hit a conflict — the custom AI list now collides with upstream; resolve manually"
            exit 1
          }
          git push --force-with-lease origin release/herbertgao
